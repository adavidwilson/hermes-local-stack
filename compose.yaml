services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: hermes-tailscale
    hostname: hermes-tailscale # tailnet machine name
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    # Uncomment to expose hermes-web to the Docker host and LAN
    # Needed here because hermes-web is in service mode networking
    # ports:
    #   - "9120:9120"
    volumes:
      - ./runtime/tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    networks:
      - hermes-stack
    restart: unless-stopped
  inference:
    # server-vulkan defaults to 0.0.0.0:8080
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-v1.0.0-b12359-b1b770d
    container_name: hermes-inference
    entrypoint:
      - /app/llama-server
    environment:
      - LLAMA_ARG_MODELS_MAX=1
    # Specifying LLAMA_ARG_MODELS_PRESET with the server-vulkan image fails
    # Using LLAMA_ARG_MODELS_PRESET no models are found
    # Using --models-preset works
    command:
      - --models-preset
      - /models/models.ini
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./runtime/models:/models:ro
    networks:
      - hermes-stack
    restart: unless-stopped
  hermes-web:
    image: nousresearch/hermes-agent:v0.23.3
    container_name: hermes-web
    command: ["gateway", "run"]
    restart: unless-stopped
    depends_on:
      - inference
      - tailscale
      - hindsight
    volumes:
      - ./runtime/hermes-home:/opt/data
      - ./ssh_config:/root/.ssh/config
    environment:
      # Run Hermes as the standard non-root user for easy host directory access
      - HERMES_UID=1000
      - HERMES_GID=1000
      # Auth required for broadcast availability
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASSWORD}
    # Needed for tailscale. Upstream documentation example is misleading
    network_mode: service:tailscale
  hindsight:
    # Hindsight memory provider (local_external for Hermes), sharing the llama.cpp `inference` service.
    # No ports are published to the host; reachable only over the internal hermes-stack network.
    image: ghcr.io/vectorize-io/hindsight:v1.2.3
    container_name: hermes-hindsight
    restart: unless-stopped
    stop_grace_period: 75s # ~60s for Hindsight to drain tasks on stop
    shm_size: 1g
    depends_on:
      - inference
    networks:
      - hermes-stack
    environment:
      # Point Hindsight at the shared llama.cpp server (OpenAI-compatible).
      - HINDSIGHT_API_LLM_PROVIDER=openai
      - HINDSIGHT_API_LLM_BASE_URL=http://inference:8080/v1
      - HINDSIGHT_API_LLM_MODEL=Ornith1.5-General # served stem; omit to query /v1/models
      - HINDSIGHT_API_LLM_MAX_CONCURRENT=2 # don't starve Hermes off the shared llama.cpp
      - HINDSIGHT_API_WORKER_ID=hermes-hindsight
    volumes:
      - hindsight-data:/home/hindsight/.pg0
volumes:
  hindsight-data:
networks:
  hermes-stack:

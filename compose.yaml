x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: hermes-tailscale
    hostname: hermes-tailscale # tailnet machine name
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    # Uncomment to expose hermes-web to the Docker host and LAN
    # Needed here because hermes-web is in service mode networking
    # ports:
    #   - "9120:9120"
    volumes:
      - ./runtime/tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    networks:
      - hermes-stack
    # `tailscale status` exits 0 once the machine is authenticated/connected.
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped
  inference:
    # server-vulkan defaults to 0.0.0.0:8080
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-v1.0.0-b12359-b1b770d
    container_name: hermes-inference
    entrypoint:
      - /app/llama-server
    # Specifying LLAMA_ARG_MODELS_PRESET with the server-vulkan image fails
    # Using LLAMA_ARG_MODELS_PRESET no models are found
    # Using --models-preset works
    command:
      - --api-key
      - ${LLAMA_API_KEY}
      - --no-webui
      - --models-preset
      - /models/models.ini
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./runtime/models:/models:ro
    networks:
      - hermes-stack
    # HTTP /health, not a TCP check: /health is public (no API key) and returns 200
    # only once the model is loaded, so it tells "up" from "ready" across the slow
    # RDNA1 load. start_period covers that load.
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    logging: *default-logging
    restart: unless-stopped
  hermes-web:
    image: nousresearch/hermes-agent:v0.23.3
    container_name: hermes-web
    command: ["gateway", "run"]
    userns_mode: keep-id
    restart: unless-stopped
    depends_on:
      inference:
        condition: service_healthy
      tailscale:
        condition: service_healthy
    volumes:
      - ./runtime/hermes-home:/opt/data
      - ./ssh_config:/root/.ssh/config
      # Optional extra project dir; override HERMES_EXTRA_WORKSPACE in .env.
      - ${HERMES_EXTRA_WORKSPACE:-../Organize}:/opt/data/workspace/projects/Organize
    # Gateway API server's public /health (no auth). Requires the API server enabled on :8642.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging
    environment:
      # Run Hermes as the standard non-root user for easy host directory access
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      # Auth required for broadcast availability
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASSWORD}
      # Same key the inference server requires; config.yaml names it via key_env.
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    # Needed for tailscale. Upstream documentation example is misleading
    network_mode: service:tailscale
networks:
  hermes-stack:

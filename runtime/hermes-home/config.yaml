webapp:
  enabled: true
  host: "0.0.0.0" # needed to accept requests to tailnet IPs
  port: 9120
  # Use http://<machine>.<tailnet>:<port> replacing with your values
  # Set TAILNET_ID in Hermes' .env, e.g.:
  # `hermes config set TAILNET_ID <value>`
  # Only needed for OIDC auth or specifying https
  # public_url: http://hermes-tailscale.${TAILNET_ID}.ts.net:9120
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
_config_version: 54
display:
  in_app_tours: false
  in_app_tips: false
model:
  default: deepseek/deepseek-v4.1-flash-1017
  provider: openrouter
provider_routing:
  # Keyed by the model slug in model.default above; change one, change both.
  sort: "price"
  data_collection: "deny"
  models:
    deepseek/deepseek-v4.1-flash-1017:
      order:
        - tenstorrent
        - pearl-research
        - cloudflare
      ignore:
        - ambient
        - pareto-inference
        - streamlake
        - alibaba
        - cohere
        - baidu
        - siliconflow
        - deepseek
        - novita
agent:
  reasoning_effort: medium
  max_turns: 150
plugins:
  enabled:
    - disk-cleanup
    - security-guidance
  disabled: []
stt:
  enabled: false
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
known_plugin_toolsets:
  cli:
    - a2a
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
sessions:
  auto_prune: true

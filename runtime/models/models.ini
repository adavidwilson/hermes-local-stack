version = 1

; See https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md#model-presets

[Qwen-3.6-3.8-Distill]
; Model paths
model = /models/Qwen-3.6-3.8-Distill/Qwen3.8-35B-A3B-Q4_K_M.gguf
mmproj = /models/Qwen-3.6-3.8-Distill/mmproj-Qwen3.8-35B-A3B-F16.gguf

; Model params
; default:
; temp = 1.0
; agentic coding:
temp = 0.6
top-p = 0.95
top-k = 20

; Context
c = 100000

; Optimization
fitt = 64
;fa = on
;ngl = all
;n-cpu-moe = 0
;ctk = q8_0
;ctv = q8_0
;t = 8

; Other
jinja = true
image-min-tokens = 1024
;load-on-startup = true
;spec-type = draft-mtp
;spec-draft-n-max = 1
;spec-draft-p-min = 0.8

[Tiel]
; Model paths
model = /models/Tiel/Tiel-Coder-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /models/Tiel/mmproj-BF16.gguf

; Model params
; default:
; temp = 1.0
; agentic coding:
temp = 0.6
